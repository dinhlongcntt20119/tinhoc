<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị viên - Tin học 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 800px; margin: 0 auto; }
        .text-center { text-align: center; }
        h2 { color: #0056b3; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: #0056b3; outline: none; box-shadow: 0 0 5px rgba(0,86,179,0.3); }
        
        .btn { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; background-color: #0056b3; color: white; margin-top: 10px; }
        .btn:hover { background-color: #004494; }
        
        #error-msg { color: #dc3545; font-size: 0.9rem; margin-top: 15px; display: none; }

        /* Dashboard Styles */
        #dashboard { display: none; }
        .switch-container { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #fdfbf7; border-left: 4px solid #ff9800; border-radius: 6px; margin-top: 20px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(24px); }

        .tabs { display: flex; margin-top: 20px; border-bottom: 2px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #555; }
        .tab.active { color: #0056b3; border-bottom: 3px solid #0056b3; margin-bottom: -2px; }
        .tab-content { display: none; padding: 20px 0; text-align: left; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr.student-row { cursor: pointer; }
        tr.student-row:hover { background-color: #f9f9f9; }

        .details-row { display: none; background-color: #fafafa; }
        .details-box { padding: 15px; border-left: 3px solid #0056b3; margin: 10px; background: #fff; }

        .logout-btn { background: #dc3545; margin-top: 20px; width: auto; padding: 10px 20px; }
        .logout-btn:hover { background: #c82333; }
    </style>
</head>
<body>

    <!-- Login View -->
    <div class="container" id="login-view">
        <h2 class="text-center"><i class="fas fa-lock"></i> Đăng nhập Quản trị</h2>
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập tên đăng nhập">
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu">
        </div>
        <button class="btn" onclick="checkLogin()">Đăng nhập</button>
        <div id="error-msg" class="text-center">Sai tên đăng nhập hoặc mật khẩu!</div>
    </div>

    <!-- Dashboard View -->
    <div class="container text-center" id="dashboard">
        <h2><i class="fas fa-cogs"></i> Bảng điều khiển</h2>

        <div class="switch-container">
            <div style="text-align: left;">
                <strong><i class="fas fa-random"></i> Đảo câu hỏi</strong>
                <div style="font-size: 0.8rem; color: #666; margin-top: 3px;">Học sinh vào link sẽ tự động gặp đề đảo nếu mục này ở trạng thái bật.</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="shuffleToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('trac-nghiem')">Ôn tập trắc nghiệm HK2</div>
            <div class="tab" onclick="switchTab('vo-bai-tap')">Ôn tập VBT HK2</div>
        </div>

        <div id="trac-nghiem" class="tab-content active">
            <table id="table-ontaphk2">
                <thead>
                    <tr><th>Họ và tên</th><th>Lớp</th><th>Điểm số</th><th>Thời gian</th></tr>
                </thead>
                <tbody id="tbody-ontaphk2"><tr><td colspan="4">Đang tải dữ liệu...</td></tr></tbody>
            </table>
        </div>

        <div id="vo-bai-tap" class="tab-content">
            <table id="table-vbtontaphk2">
                <thead>
                    <tr><th>Họ và tên</th><th>Lớp</th><th>Điểm số</th><th>Thời gian</th></tr>
                </thead>
                <tbody id="tbody-vbtontaphk2"><tr><td colspan="4">Đang tải dữ liệu...</td></tr></tbody>
            </table>
        </div>

        <button class="btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, where, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        window.db = db;
        window.collection = collection;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;
        window.doc = doc;
        window.setDoc = setDoc;

        // Sync initial toggle state
        getDoc(doc(db, "settings", "quizConfig")).then((docSnap) => {
            if (docSnap.exists() && docSnap.data().shuffle) {
                document.getElementById('shuffleToggle').checked = true;
            }
        });

        document.getElementById('shuffleToggle').addEventListener('change', async (e) => {
            const isChecked = e.target.checked;
            try {
                await setDoc(doc(db, "settings", "quizConfig"), { shuffle: isChecked, updatedAt: new Date().toISOString() });
            } catch(error) {
                console.error("Lỗi khi cập nhật trạng thái đảo câu:", error);
            }
        });

        window.loadData = async function() {
            try {
                // Fetch ontaphk2
                const q1 = query(collection(db, "submissions"), where("schoolId", "==", "tin-hoc-4"), where("quizType", "==", "ontaphk2"));
                const snap1 = await getDocs(q1);
                renderTable(snap1, 'tbody-ontaphk2');

                // Fetch vbtontaphk2
                const q2 = query(collection(db, "submissions"), where("schoolId", "==", "tin-hoc-4"), where("quizType", "==", "vbtontaphk2"));
                const snap2 = await getDocs(q2);
                renderTable(snap2, 'tbody-vbtontaphk2');
            } catch (e) {
                document.getElementById('tbody-ontaphk2').innerHTML = `<tr><td colspan="4">Lỗi: ${e.message}</td></tr>`;
            }
        };

        function renderTable(snapshot, tbodyId) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';
            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="4">Chưa có dữ liệu</td></tr>';
                return;
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                const tr = document.createElement('tr');
                tr.className = 'student-row';
                tr.innerHTML = `<td>${data.studentName}</td><td>${data.studentClass}</td><td><b>${data.score}/${data.total}</b></td><td>${new Date(data.createdAt).toLocaleString('vi-VN')}</td>`;
                
                const trDetails = document.createElement('tr');
                trDetails.className = 'details-row';
                trDetails.innerHTML = `<td colspan="4">
                    <div class="details-box">
                        <strong>Chi tiết bài làm:</strong>
                        <div style="margin-top:10px; font-family: monospace; white-space: pre-wrap;">${data.answers}</div>
                    </div>
                </td>`;

                tr.onclick = () => {
                    trDetails.style.display = trDetails.style.display === 'table-row' ? 'none' : 'table-row';
                };

                tbody.appendChild(tr);
                tbody.appendChild(trDetails);
            });
        }
    </script>
    
    <script>
        if (sessionStorage.getItem('isAdmin') === 'true') {
            showDashboard();
        }

        function checkLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'Admin' && p === 'thaylongtinhoc') {
                sessionStorage.setItem('isAdmin', 'true');
                showDashboard();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function showDashboard() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            if(window.loadData) window.loadData();
            else setTimeout(() => { if(window.loadData) window.loadData(); }, 1000);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function logout() {
            sessionStorage.removeItem('isAdmin');
            location.reload();
        }
    </script>
</body>
</html>
