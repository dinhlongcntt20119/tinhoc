<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị viên - Tin học 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ... existing styles ... */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 900px; margin: 0 auto; }
        .text-center { text-align: center; }
        h2 { color: #0056b3; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; color: #555; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: #0056b3; outline: none; box-shadow: 0 0 5px rgba(0,86,179,0.3); }
        
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; background-color: #0056b3; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { background-color: #004494; }
        .btn-full { width: 100%; margin-top: 10px; }
        
        #error-msg { color: #dc3545; font-size: 0.9rem; margin-top: 15px; display: none; }

        /* Dashboard Styles */
        #dashboard { display: none; }
        .switch-container { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #fff8e1; border-left: 4px solid #ff9800; border-radius: 6px; margin-top: 20px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(24px); }

        .tabs { display: flex; margin-top: 20px; border-bottom: 2px solid #ddd; gap: 10px; }
        .tab { padding: 12px 24px; cursor: pointer; font-weight: bold; color: #666; border-radius: 8px 8px 0 0; transition: 0.2s; }
        .tab:hover { background: #eee; }
        .tab.active { color: white; background: #0056b3; position: relative; }

        .tab-content { display: none; padding: 20px 0; }
        .tab-content.active { display: block; }

        .search-sort-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-sort-bar input { flex: 2; min-width: 200px; }
        .search-sort-bar select { flex: 1; min-width: 150px; }

        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .class-card { background: #fff; border: 2px solid #0056b3; color: #0056b3; padding: 20px; text-align: center; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.2rem; transition: 0.3s; }
        .class-card:hover { background: #0056b3; color: white; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .class-card span { display: block; font-size: 0.9rem; font-weight: normal; margin-top: 5px; opacity: 0.8; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #555; cursor: pointer; }
        th:hover { background: #e9ecef; }
        tr:hover { background-color: #f9f9fb; }

        .btn-delete { background: #ff5252; padding: 5px 10px; font-size: 0.8rem; }
        .btn-delete:hover { background: #ff1744; }
        .btn-back { background: #607d8b; margin-bottom: 15px; }
        
        .logout-btn { background: #dc3545; margin-top: 30px; }

        .empty-state { padding: 40px; text-align: center; color: #888; border: 2px dashed #ddd; border-radius: 12px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Login View -->
    <div class="container" id="login-view">
        <h2 class="text-center"><i class="fas fa-lock"></i> Đăng nhập Quản trị</h2>
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập tên đăng nhập">
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu">
        </div>
        <button class="btn btn-full" onclick="checkLogin()">Đăng nhập</button>
        <div id="error-msg" class="text-center">Sai tên đăng nhập hoặc mật khẩu!</div>
    </div>

    <!-- Dashboard View -->
    <div class="container" id="dashboard">
        <h2 class="text-center"><i class="fas fa-chart-line"></i> Bảng điều khiển</h2>

        <div class="switch-container">
            <div style="text-align: left;">
                <strong><i class="fas fa-random"></i> Đảo câu hỏi</strong>
                <div style="font-size: 0.8rem; color: #666; margin-top: 3px;">Học sinh vào link sẽ gặp đề đảo nếu mục này ở trạng thái bật.</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="shuffleToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="tabs">
            <div class="tab active" data-type="ontaphk2" onclick="switchTab('trac-nghiem', 'ontaphk2')">Ôn tập trắc nghiệm HK2</div>
            <div class="tab" data-type="vbtontaphk2" onclick="switchTab('vo-bai-tap', 'vbtontaphk2')">Ôn tập VBT HK2</div>
            <div class="tab" data-type="thuchanhhk2" onclick="switchTab('thuc-hanh', 'thuchanhhk2')">Ôn tập thực hành HK2</div>
        </div>

        <div id="tab-container">
            <div class="search-sort-bar">
                <input type="text" id="searchInput" placeholder="Tìm kiếm tên học sinh..." oninput="applyFilters()">
                <select id="sortSelect" onchange="applyFilters()">
                    <option value="timeDesc">Mới nhất</option>
                    <option value="timeAsc">Cũ nhất</option>
                    <option value="scoreDesc">Điểm cao</option>
                    <option value="nameAsc">Tên (A-Z)</option>
                </select>
            </div>

            <div id="class-view">
                <div class="class-grid" id="classGrid">
                    <!-- Classes will be rendered here -->
                </div>
            </div>

            <div id="student-view" style="display: none;">
                <button class="btn btn-back" onclick="showClassList()"><i class="fas fa-arrow-left"></i> Quay lại danh sách lớp</button>
                <div id="selected-class-title" style="margin-bottom: 15px; font-weight: bold; font-size: 1.2rem; color: #0056b3;"></div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Họ và tên</th>
                                <th>Lớp</th>
                                <th>Điểm số</th>
                                <th>Thời gian</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <!-- Students will be rendered here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button class="btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất hệ thống</button>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, where, getDocs, doc, setDoc, getDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        window.db = db;
        let currentQuizType = 'ontaphk2';
        let allSubmissions = [];
        let filteredSubmissions = [];
        let selectedClass = null;

        // Init settings
        getDoc(doc(db, "settings", "quizConfig")).then((snap) => {
            if (snap.exists() && snap.data().shuffle) document.getElementById('shuffleToggle').checked = true;
        });

        document.getElementById('shuffleToggle').addEventListener('change', async (e) => {
            try {
                await setDoc(doc(db, "settings", "quizConfig"), { shuffle: e.target.checked, updatedAt: new Date().toISOString() });
            } catch(error) { console.error(error); }
        });

        window.loadQuizData = async function(quizType) {
            currentQuizType = quizType;
            const classGrid = document.getElementById('classGrid');
            classGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center;">Đang tải...</div>';
            
            try {
                const q = query(
                    collection(db, "submissions"), 
                    where("schoolId", "==", "tin-hoc-4"), 
                    where("quizType", "==", quizType),
                    orderBy("createdAt", "desc")
                );
                const snap = await getDocs(q);
                allSubmissions = [];
                snap.forEach(doc => {
                    allSubmissions.push({ id: doc.id, ...doc.data() });
                });

                renderClasses();
            } catch (e) {
                console.error(e);
                classGrid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color: red;">Lỗi tải dữ liệu: ${e.message}</div>`;
            }
        };

        function renderClasses() {
            const classGrid = document.getElementById('classGrid');
            const classesMap = {};
            
            allSubmissions.forEach(s => {
                const c = s.studentClass || "N/A";
                if (!classesMap[c]) classesMap[c] = 0;
                classesMap[c]++;
            });

            const sortedClasses = Object.keys(classesMap).sort();
            
            if (sortedClasses.length === 0) {
                classGrid.innerHTML = '<div class="empty-state">Chưa có học sinh nào làm bài này</div>';
                return;
            }

            classGrid.innerHTML = '';
            sortedClasses.forEach(c => {
                const card = document.createElement('div');
                card.className = 'class-card';
                card.innerHTML = `${c} <span>${classesMap[c]} học sinh</span>`;
                card.onclick = () => showStudentsOfClass(c);
                classGrid.appendChild(card);
            });
        }

        window.showStudentsOfClass = function(className) {
            selectedClass = className;
            document.getElementById('class-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'block';
            document.getElementById('selected-class-title').innerText = `Danh sách lớp: ${className}`;
            applyFilters();
        };

        window.showClassList = function() {
            selectedClass = null;
            document.getElementById('class-view').style.display = 'block';
            document.getElementById('student-view').style.display = 'none';
        };

        window.applyFilters = function() {
            if (!selectedClass) return;

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            // Filter
            filteredSubmissions = allSubmissions.filter(s => 
                (s.studentClass === selectedClass) && 
                (s.studentName.toLowerCase().includes(searchTerm))
            );

            // Sort
            filteredSubmissions.sort((a, b) => {
                if (sortBy === 'timeDesc') return new Date(b.createdAt) - new Date(a.createdAt);
                if (sortBy === 'timeAsc') return new Date(a.createdAt) - new Date(b.createdAt);
                if (sortBy === 'scoreDesc') return b.score - a.score;
                if (sortBy === 'nameAsc') return a.studentName.localeCompare(b.studentName);
                return 0;
            });

            renderStudentTable();
        };

        function renderStudentTable() {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';

            if (filteredSubmissions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Không tìm thấy kết quả</td></tr>';
                return;
            }

            filteredSubmissions.forEach(s => {
                const tr = document.createElement('tr');
                const resultText = s.quizType === 'thuchanhhk2' ? '<span style="color:#27ae60; font-weight:bold;">Đã xem/Hoàn thành</span>' : `<b>${s.score}/${s.total}</b>`;
                tr.innerHTML = `
                    <td>${s.studentName}</td>
                    <td>${s.studentClass}</td>
                    <td>${resultText}</td>
                    <td>${new Date(s.createdAt).toLocaleString('vi-VN')}</td>
                    <td><button class="btn btn-delete" onclick="confirmDelete('${s.id}')"><i class="fas fa-trash"></i> Xóa</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.confirmDelete = async function(id) {
            if (confirm("Bạn có chắc chắn muốn xóa bài làm này không? Hành động này không thể hoàn tác.")) {
                try {
                    await deleteDoc(doc(db, "submissions", id));
                    allSubmissions = allSubmissions.filter(s => s.id !== id);
                    applyFilters();
                    if (selectedClass) {
                        // Re-check classes count
                        const stillHasClass = allSubmissions.some(s => s.studentClass === selectedClass);
                        if (!stillHasClass) showClassList();
                    }
                    renderClasses();
                } catch (e) {
                    alert("Lỗi khi xóa: " + e.message);
                }
            }
        };

        window.switchTab = function(tabId, quizType) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[data-type="${quizType}"]`).classList.add('active');
            
            showClassList();
            loadQuizData(quizType);
        };

        // Initial load
        window.loadQuizData('ontaphk2');
    </script>
    
    <script>
        // Use simple global functions for non-module parts if needed
        function checkLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'Admin' && p === 'thaylongtinhoc') {
                sessionStorage.setItem('isAdmin', 'true');
                showDashboard();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function showDashboard() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }

        function logout() {
            sessionStorage.removeItem('isAdmin');
            location.reload();
        }

        if (sessionStorage.getItem('isAdmin') === 'true') {
            showDashboard();
        }
    </script>
</body>
</html>
